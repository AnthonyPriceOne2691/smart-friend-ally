# SwiftLint — shape oracles для Swift-слоя (CQG §2.1/§2.2, адаптация под стек; образец — lash-try-on).
# Пороги канона: функция soft 50 / hard 80, сложность soft 8 / hard 10, аргументы 8, вложенность 4. Длину файлов
# ведёт check_file_length.sh (маска *.swift), поэтому file_length здесь отключён — один источник истины.
# custom_rules — Swift-двойники ролей, которые у Python держали check_grep_gate.sh и check_ast_gate.py
# (scripts/lint/not-applicable.json называет, какое правило держит какую роль).

included:
  - Packages
  - App

excluded:
  - Packages/AllyDiscipline/.build
  - Packages/AllyCore/.build
  - Packages/AllyLlama/.build
  - Packages/AllyOnnx/.build
  - Packages/AllyHearing/.build
  - Packages/AllyVoice/.build
  - Packages/AllyShell/.build
  - Packages/AllySpeechText/.build
  - Packages/AllySQLite/.build
  - Packages/AllyMemory/.build
  - Packages/AllyAccent/.build
  - Packages/AllyVoiceFX/.build
  - App/build
  - App/build-demo
  - Packages/AllyDiscipline/Tests/DisciplineTests/Fixtures

disabled_rules:
  - file_length          # ведёт check_file_length.sh
  - todo                 # задачи — в delivery/active/tasks.md
  - trailing_comma

opt_in_rules:
  - force_unwrapping
  - empty_count
  - first_where
  - toggle_bool

line_length:
  warning: 120
  error: 160

function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 300
  error: 500

cyclomatic_complexity:
  warning: 8
  error: 10

function_parameter_count:
  warning: 5
  error: 8

nesting:
  type_level: 2
  function_level: 4

identifier_name:
  min_length: 1
  max_length: 50

custom_rules:
  no_print:              # роль unstructured-log (check_grep_gate.sh:unstructured-log)
    name: "Логи через os.Logger"
    regex: '\b(print|debugPrint|NSLog)\s*\('
    message: "print/NSLog не попадают в журнал: логируй через os.Logger"
    severity: error
  empty_catch:           # роли silent-except и blind-error (check_ast_gate.py, check_grep_gate.sh)
    name: "Пустой catch"
    regex: 'catch\b[^{\n]*\{\s*\}'
    message: "Ошибка проглочена молча: обработай или залогируй"
    severity: error
  env_access:            # роль config-access (check_grep_gate.sh:config-access)
    name: "Окружение мимо конфига"
    regex: '(ProcessInfo\.processInfo\.environment|\bgetenv\s*\()'
    message: "Настройки — через конфиг, а не через окружение процесса"
    severity: error
  inline_prompt:         # роль inline-prompt (check_ast_gate.py:inline-prompt)
    name: "Русский текст литералом"
    regex: '"[^"\n]*[А-Яа-яЁё][^"\n]{40,}"'
    excluded: ".*/Tests/.*"
    message: "Тексты и правила речи — в ресурсах (repair.json и др.), не литералом в коде"
    severity: error
  child_screen_text:     # правило экрана 1 (look-and-feel): ребёнку ни одной надписи; метка взрослого (Ш3) — своим файлом
    name: "Надпись в детском экране"
    regex: '\b(Text|Label|TextField|SecureField|TextEditor|ProgressView|Toggle)\s*\('
    included: ".*/Packages/AllyShell/Sources/ShellUI/.*"
    excluded: ".*/ShellUI/AdultZone\\.swift"
    message: "Ребёнку ни одной надписи (правило экрана 1): состояние показывает тело Элли, текст — только в зоне взрослых"
    severity: error
  child_screen_gestures:  # правило экрана 3 (look-and-feel): в детском экране только тап (оболочка Ш3)
    name: "Жест в детском экране"
    regex: '\b(LongPressGesture|DragGesture|MagnifyGesture|MagnificationGesture|RotateGesture|RotationGesture|onLongPressGesture|onDrag|swipeActions)\b|TapGesture\(count:\s*[2-9]|onTapGesture\(count:\s*[2-9]'
    included: ".*/(Packages/AllyShell/Sources/ShellUI/.*|App/Sources/ChildScreen\\.swift)"
    message: "Пятилетке — только тап (правило экрана 3): без долгого нажатия, перетаскивания, щипка, поворота, свайпа и двойного тапа"
    severity: error
  no_network:            # граница CONSTITUTION «продукт не ходит в сеть»; артефакт судит check_app_artifact.sh
    name: "Сеть в продукте"
    regex: '\b(URLSession|NSURLSession|NWConnection|NWPathMonitor|WKWebView|SFSpeechRecognizer|AssetInventory)\b|^\s*import\s+(Network|WebKit|CloudKit|StoreKit)\b'
    message: "Продукт офлайн: сеть, веб, загрузка ассетов и серверное распознавание запрещены"
    severity: error
  blocking_wait:         # роль cpu-in-async (check_ast_gate.py:cpu-in-async): поток пула не ждёт вслепую
    name: "Блокирующее ожидание"
    regex: '\.wait\(\s*(timeout:[^)]*)?\)|\bThread\.sleep\(|\busleep\('
    message: "Семафор, sleep и wait держат поток: жди через async или свою очередь"
    severity: error
  unbounded_stream:      # роль unbounded-list (check_ast_gate.py:unbounded-list): у буфера есть граница
    name: "Поток без политики буфера"
    regex: '(?<!-> )\bAsync(Throwing)?Stream(<[^>\n]*>)?(\s*\{|\((?![^)\n]*(bufferingPolicy|unfolding))|\.makeStream\((?![^)\n]*bufferingPolicy))'
    message: "AsyncStream без bufferingPolicy копит без предела: задай .bufferingNewest/.bufferingOldest"
    severity: error
