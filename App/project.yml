# XcodeGen 2.46: the source of Ally.xcodeproj (generated, not in git). The team lives in the ignored Local.xcconfig.
name: Ally
options:
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: Ally.xcconfig
packages:
  AllyCore:
    path: ../Packages/AllyCore
  AllyLlama:
    path: ../Packages/AllyLlama
  AllyShell:
    path: ../Packages/AllyShell
  AllyHearing:  # Silero VAD through sherpa on the one ONNX Runtime of the app (D7.2)
    path: ../Packages/AllyHearing
  AllyVoice:  # her voice: Supertonic on the same ONNX Runtime (voice series V1b, V4b2)
    path: ../Packages/AllyVoice
  AllyVoiceFX:  # PSOLA and the EQ after the synthesis (V4a, V4b1)
    path: ../Packages/AllyVoiceFX
  AllySpeechText:  # the engine's text: stresses, names, reading rules (V2)
    path: ../Packages/AllySpeechText
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ally:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
      - path: ../.github/allowed_signers  # the parent's key for the exception (R child-lock), one copy with the Mac
        buildPhase: resources
    dependencies:
      - package: AllyCore
      - package: AllyLlama
      - package: AllyShell  # the child screen (Ш3): Ellie in her bubble, the break after the limit
        product: ShellUI
      - package: AllyShell
        product: ShellCore
      - package: AllyHearing
      - package: AllyVoice
      - package: AllyVoiceFX
      - package: AllySpeechText
    info:  # generated with the project, not in git; merged with the build's own keys (GENERATE_INFOPLIST_FILE)
      path: Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true  # ProMotion: listening may run at 120 Hz (the parent's answer 5)
        CFBundleShortVersionString: $(MARKETING_VERSION)  # the file's keys win over the generated ones
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: Ally.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anthonypriceone.ally
        INFOPLIST_KEY_CFBundleDisplayName: Ally
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Ally слушает фразу взрослого, чтобы подруга ответила голосом."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Речь распознаётся на телефоне, без сети."
