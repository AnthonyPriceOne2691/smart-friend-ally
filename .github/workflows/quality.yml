name: quality

# Адаптация шаблона CQG §8.3 под Smart Friend Ally (объявлена в
# scripts/lint/adapted.json). Продукт — Swift: пакет Packages/AllyDiscipline, кода
# приложения пока нет; механика контура — python. Всё идёт на ubuntu: пакет держится
# одного Foundation и собирается на Linux, macOS-раннер тарифицируется 10x (§8.7).
# Сняты: установка node и фронта, LINT_*-пути под backend/frontend, шаги
# diff-coverage, deps-audit и mutation — их роли объявлены в
# scripts/lint/not-applicable.json с причиной, роли на Swift держат свои гейты (карта
# ролей — delivery/STACK-ACCEPTANCE.md). Инструменты контура — из корневого
# requirements-dev.txt в .venv; SwiftLint и jscpd — закреплённые версии. Своё: джоба
# swift (тесты и покрытие пакета), шаг delivery в простое зовёт гейт. Остальное — дословно.

on:
  pull_request:
  push:
    branches: [main]

# Отмена устаревших прогонов той же ветки. Без этого пуш серии коммитов держит
# столько параллельных прогонов, сколько было пушей, и квота уходит на проверку
# кода, который уже неактуален. §8.7 требует считать цену прогона — это первый
# способ её снизить, не убирая ни одной проверки.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  STRICT: "1"                 # soft-режим в CI запрещён (Delivery §10.4)
  # LINT_PY_SRC/LINT_FE_DIR/LINT_BE_DIR/LINT_COV_PKG шаблона сняты: backend/ и
  # frontend/ нет. Маски Swift для канонных гейтов — env джобы gates ниже.

jobs:
  gates:
    runs-on: ubuntu-latest
    # §8.7: предохранитель, а не оптимизация — гейты — секунды-минуты; 20 значит «что-то повисло».
    timeout-minutes: 20
    # Маски Swift для канонных гейтов (CQG §5.5: адаптация в конфиге). Те же значения стоят в entry хуков;
    # здесь — чтобы доктор, который зовёт гейт напрямую, судил тот же код, что и pre-commit.
    env:
      LINT_LENGTH_GLOBS: "*.swift *.py *.c *.h"
      LINT_PY_SRC: Packages/AllyDiscipline/Sources
      LINT_JSCPD_PY_FORMAT: swift
      # Вторая половина jscpd — исходники AllyCore (voice-core): маска игнора гейта знает `**/tests/**` строчными,
      # а тесты Swift лежат в `Tests/`, поэтому не общий корень `Packages`, а второй каталог исходников.
      LINT_TS_SRC: Packages/AllyCore/Sources
      LINT_JSCPD_TS_FORMAT: swift
      LINT_JSCPD_TS_EXTS: "swift:swift"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # нужен для BASE-диффа: baseline-ratchet и new-dependency
      # §8.3a: база диффа определяется ОДИН раз на джобу и называет отказ вслух.
      #
      # ⚠ Прежняя форма стояла в каждом шаге:
      # `BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}`.
      # На событии **push** `base_ref` пуст, фолбэк даёт `origin/main`, а на push
      # в main это САМ HEAD — дифф пуст. Четыре проверки судили пустоту: с
      # `okf@1.16` гейт канона краснел (и main краснел после КАЖДОГО слияния), а
      # breakers, ratchet и diff-coverage проходили ТРИВИАЛЬНО и молча, что хуже:
      # их зелёное уезжало в отчёт как «проверено». Замерено на `local-web-agent`
      # 2026-09-26, прогоны 36260966608 и 36260992795.
      #
      # Лестница без молчаливой ступени: PR — ветка назначения; push — состояние
      # ДО толчка (`github.event.before`); ни то ни другое недостижимо — отказ с
      # названной причиной, а не тихий фолбэк на HEAD.
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              # Новая ветка (before = нули) или переписанная история: прошлого
              # состояния в дереве нет. Берём общую базу с веткой по умолчанию —
              # и только если она НЕ равна HEAD, иначе это снова «судить ничего».
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      # ⚠ Версия ОБЯЗАНА совпадать с локальной. Иначе гейты проверяют один
      # интерпретатор, а разработка идёт на другом, и часть падений видна только
      # в CI (реальный случай: mypy крашился на 3.12 и работал на 3.14). Держи
      # одно значение здесь и в `requires-python` / `.python-version` проекта.
      # ⚠ `cache:` вычисляется, а не пишется константой, и это не аккуратность.
      # `cache: pip` требует python-манифеста: на проекте без него (Astro/TS)
      # `setup-python` падает с `No file matched to [**/requirements.txt or
      # **/pyproject.toml]` — то есть шаблон канона нёс питоновское допущение и
      # ронял ВСЮ джобу гейтов до первого гейта. Замерено на восьмом развёртывании;
      # тот же класс, что маска гейта, не знающая про `.astro` (cqg@1.69).
      # Пустая строка = кэш выключен, и это штатное значение действия.
      # ⚠ `cache-dependency-path` задан ЯВНО — находка первого прогона Ally
      # (36990914981): охрана `cache:` выше смотрит `**/requirements*.txt`, а
      # setup-python по умолчанию ищет точное `**/requirements.txt`. На проекте
      # только с requirements-dev.txt охрана включала кэш, а действие не находило
      # файла и роняло всю джобу гейтов до первого гейта (кандидат наверх).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # ← выровнять с локальной версией проекта
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') != '' && 'pip' || '' }}
          cache-dependency-path: requirements-dev.txt

      # Инструменты контура — по манифесту, а не командой мимо него (lab-11 F9):
      # тот же requirements-dev.txt, что ставится локально в .venv. Шаги шаблона
      # setup-node, Install backend deps и Install frontend deps сняты: backend/ и
      # frontend/ нет (стек Swift).
      - name: Install contour tools
        run: |
          python -m venv .venv
          echo "deps: requirements-dev.txt"
          .venv/bin/pip install -r requirements-dev.txt
          # Swift-контур (поставка swift-contour): SwiftLint — Linux-сборка релиза, jscpd — npm; версии закреплены.
          if git ls-files -- '*.swift' | grep -q .; then
            curl -fsSL -o /tmp/swiftlint.zip \
              https://github.com/realm/SwiftLint/releases/download/0.65.0/swiftlint_linux_amd64.zip
            sudo unzip -o -q /tmp/swiftlint.zip swiftlint -d /usr/local/bin
            sudo chmod +x /usr/local/bin/swiftlint
            # SourceKit для SwiftLint на Linux — из Swift, что стоит на образе раннера
            if command -v swift >/dev/null; then
              echo "LINUX_SOURCEKIT_LIB_PATH=$(dirname "$(dirname "$(readlink -f "$(command -v swift)")")")/lib" >> "$GITHUB_ENV"
            fi
            swiftlint version
            npm install -g jscpd@4.0.5 >/dev/null 2>&1
            jscpd --version
          fi

      # ⚠ ГЛАВНЫЙ УРОК восьмого развёртывания, и он не про кэш. Когда шаг установки
      # упал, соседние гейты с `if: always()` отработали и отчитались ЗЕЛЁНЫМ —
      # каждый честно сказал «инструмента нет → пропуск», а в сумме это читается
      # как «гейты прошли». Локально такой пропуск честен (стенд беден), в CI —
      # нет: инструменты ставятся шагом выше, и их отсутствие означает, что шаг
      # упал. Поэтому здесь пропуск переводится в КРАСНОЕ, и делается это до
      # гейтов, чтобы причина стояла в логе раньше их зелёных галок.
      # ⚠ Список НЕ зашит: он выводится из того, что объявил САМ ПРОЕКТ.
      # Первая редакция (cqg@1.85) ждала `backend/.venv/bin/{ruff,mypy,
      # detect-secrets}` — и на npm-проекте роняла джобу, хотя ruff и mypy там
      # объявлены `n/a`, а venv не заводится вовсе. Это девятый рецидив класса
      # «шаблон канона несёт питоновское допущение», и заведён он был шагом,
      # который этот самый класс и чинит. Нашло поле (portfolio-site, 2026-08-07).
      #
      # Правило: инструмент ожидается, если ЕСТЬ манифест его половины и роль не
      # объявлена неприменимой в `scripts/lint/not-applicable.json`. Ищем и в
      # venv, и в `node_modules/.bin`, и в PATH — где лежит, решает менеджер
      # пакетов, а не канон.
      - name: Инструменты гейтов на месте (иначе пропуск читается как успех)
        run: |
          na="scripts/lint/not-applicable.json"
          skip() { [ -f "$na" ] && grep -q "\"$1\"" "$na"; }
          have() {
            for p in "backend/.venv/bin/$1" ".venv/bin/$1" "node_modules/.bin/$1" \
                     "${LINT_FE_DIR:-frontend}/node_modules/.bin/$1"; do
              [ -x "$p" ] && return 0
            done
            command -v "$1" >/dev/null 2>&1
          }
          missing=""; checked=""
          expect() { skip "$1" || { checked="$checked $1"; have "$1" || missing="$missing $1"; }; }
          expect detect-secrets
          # ⚠ Условие идёт через `grep -q .`, а не через код возврата `ls`: `ls A B`
          # при существующем A и отсутствующем B выходит ЕДИНИЦЕЙ (замер: rc=1),
          # поэтому прежняя форма `ls **/pyproject.toml **/requirements*.txt`
          # на pyproject-проекте БЕЗ requirements.txt (uv/poetry — тот же случай,
          # что lab-11 F9) не ожидала ни ruff, ни mypy. Шаг, заведённый против
          # тихого пропуска, сам уходил в тихий пропуск.
          if ls pyproject.toml */pyproject.toml requirements*.txt */requirements*.txt 2>/dev/null | grep -q .; then
            expect ruff; expect mypy
          fi
          if [ -f package.json ] || [ -f "${LINT_FE_DIR:-frontend}/package.json" ]; then
            expect eslint; expect jscpd
          fi
          # Swift-контур: SwiftLint (ратчет) и jscpd (формат swift) ожидаются, когда есть Swift-код.
          if git ls-files -- '*.swift' | grep -q .; then
            expect swiftlint; expect jscpd
          fi
          if [ -n "$missing" ]; then
            echo "::error::инструменты гейтов не поставились:$missing"
            echo "Гейты ниже уйдут в честный пропуск, и джоба будет ВЫГЛЯДЕТЬ проверенной."
            echo "Смотри шаг установки: он упал или поставил не туда (§8.3)."
            echo "Инструмент не нужен на этом стеке — объяви роль в $na (§5.5)."
            exit 1
          fi
          echo "toolchain: проверено ->$checked (пусто = все роли объявлены n/a)"

      # ⚠ `if: always()` на КАЖДОМ независимом гейте — не косметика.
      # Шаг, который не просто падает, а КРАШИТСЯ (mypy INTERNAL ERROR), обрывает
      # джобу, и все шаги ниже не выполняются НИ РАЗУ. Реальный случай
      # (2026-07-28): четыре гейта — gate-coverage, secrets, baseline-ratchet,
      # diff-coverage — не запускались за всё развёртывание, и об этом никто не
      # сообщил: в логе их просто нет. Подключённый гейт за упавшим шагом
      # неотличим от отсутствующего (Delivery §3.1a).
      # ⚠ `--verbose` обязателен, и это не отладка. Без него pre-commit ГЛОТАЕТ
      # stdout прошедших хуков, и числа «просмотрено N файл(ов)» в лог не
      # попадают. Строка приёмки §6 («каждый гейт показал непустое число») тогда
      # проверяема локально и НЕПРОВЕРЯЕМА в CI — то есть ровно там, где по
      # §10.4 живёт истина, которую агент не может обойти. Найдено приёмкой
      # восьмого развёртывания.
      - name: pre-commit (all files, STRICT=1)
        id: precommit
        run: |
          # pre-commit — из .venv шага установки (requirements-dev.txt), не голым pip.
          .venv/bin/pre-commit run --all-files --show-diff-on-failure --verbose

      - name: Gate coverage (все гейты подключены)
        if: always()
        run: bash scripts/lint/check_gate_coverage.sh

      # ⚠ Третий из трёх РАЗНЫХ вопросов §5 шаг 5: вписаны ли гейты · зелены ли
      # вписанные · СУДЯТ ли вписанные. Третий тут не стоял, и это была не
      # мелочь: в GitLab-адаптере (§8.3a) доктор был, в этом workflow — нет,
      # то есть у инструмента был постоянный исполнитель на одном хостинге и не
      # было на другом. А канон сам требует (карта §7.1): `auto` — это про
      # постоянного исполнителя, а не про существование команды. Значит все
      # вердикты доктора — расхождение конфига со снимком, слепые гейты,
      # разъехавшиеся записи о версии — на GitHub-проекте читал только тот, кто
      # вспомнит запустить руками. Асимметрию внёс `cqg@2.01` и не заметил.
      #
      # `DEAD` роняет шаг, `WEAK`/`ABSENT`/`SKIP` — нет: доктор красен ровно
      # тогда, когда объявленная проверка молчит на своём же нарушении.
      # Замер цены: 4.7–5.5 с против двадцатиминутного бюджета джобы.
      - name: Contour doctor (гейты не только вписаны, но и судят)
        if: always()
        run: python3 scripts/lint/contour_doctor.py

      - name: Baseline ratchet (снимки только вниз)
        if: always()
        run: bash scripts/lint/check_baseline_ratchet.sh

      # Новая прямая зависимость обязана быть объявлена решением в STATUS.
      # Здесь, а не на коммите: нужен remote-ref для сравнения манифестов.
      - name: New dependency declared
        if: always()
        run: python scripts/lint/check_new_dependency.py

      # Diff coverage, Vulnerable dependencies, Mutation testing шаблона — сняты: pip-audit/mutmut/pytest-cov к Swift
      # не относятся. Покрытие Swift — джоба swift ниже (check_swift_coverage.sh); роль мутаций правил исполнителя —
      # тесты абляции пакета; зависимостей у пакета нет. Объявления — scripts/lint/not-applicable.json.

  swift:
    runs-on: ubuntu-latest
    # Swift-пакеты: тесты и покрытие строк ≥ 70% (check_swift_coverage.sh). Swift — с образа раннера, версия в логе
    # (macOS-раннер ×10, §8.7: пакет — только Foundation и собирается на Linux). 15 мин — сборка с нуля и два прогона.
    timeout-minutes: 15
    # Пакеты под покрытием: AllyCore зависит от AllyDiscipline локальным путём (поставка voice-core); AllyShell —
    # оболочка (child-shell): на Linux в отчёт идёт ShellCore, рисунок SwiftUI судят снимки на Mac; AllySpeechText —
    # текст для синтеза, без зависимостей (поставка voice-text); AllySQLite — общий SQLite приложения (libsqlite3-dev —
    # на образе раннера), AllyMemory стоит на нём (поставка memory-core); AllyAccent — RUAccent на Swift
    # (accent-tokenizers); AllyVoiceFX — обработка голоса после синтеза, C-ядро и Swift-обёртка, только Foundation
    # (поставка voice-fx): покрытие считает и C-файлы Sources/.
    env:
      LINT_SWIFT_PACKAGES: "Packages/AllyDiscipline Packages/AllyCore Packages/AllyShell Packages/AllySpeechText Packages/AllySQLite Packages/AllyMemory Packages/AllyAccent Packages/AllyVoiceFX"
    steps:
      - uses: actions/checkout@v7
      - name: Swift toolchain
        run: swift --version
      - name: Swift tests and coverage (check_swift_coverage.sh, порог 70%)
        run: bash scripts/lint/check_swift_coverage.sh
      # Отрицательный контроль: гейт, который проходит с порогом 101%, слеп (CQG §6 — гейт обязан уметь краснеть).
      - name: Coverage gate is not blind (порог 101% обязан покраснеть)
        run: |
          if LINT_COVERAGE_MIN=101 bash scripts/lint/check_swift_coverage.sh; then
            echo "::error::гейт покрытия прошёл с порогом 101% — он слеп"
            exit 1
          fi
          echo "отрицательный контроль: гейт покраснел, как и должен"
      # Один ONNX Runtime на приложение (серия голоса, пример Z1): только binaryTarget в Packages/AllyOnnx.
      - name: One ONNX Runtime (check_single_ort.sh, Z1)
        run: bash scripts/lint/check_single_ort.sh
      # Отрицательный контроль (CQG §6): копия манифестов с пакетом, несущим свой ORT, обязана покраснеть, а статический
      # xcframework sherpa как binaryTarget с условием платформы (так в Package.swift k2-fsa 1.13.8) — пройти.
      - name: ORT guard is not blind (второй ORT — красный, binaryTarget sherpa — зелёный)
        run: |
          copy() {
            tmp=$(mktemp -d)
            git ls-files -z -- '*Package.swift' 'App/project.yml' | xargs -0 -I{} cp --parents {} "$tmp/"
            mkdir -p "$tmp/Packages/Probe"
          }
          for url in 'microsoft/onnxruntime-swift-package-manager.git", exact: "1.24.2' \
                     'csukuangfj/onnxruntime-libs", from: "1.28.2' 'k2-fsa/sherpa-onnx", from: "1.13.8'; do
            copy
            printf 'let package = Package(name: "Probe", dependencies: [.package(url: "https://github.com/%s")])\n' \
              "$url" > "$tmp/Packages/Probe/Package.swift"
            if bash scripts/lint/check_single_ort.sh "$tmp"; then echo "::error::страж ORT пропустил ${url%%\"*}"; exit 1; fi
          done
          copy
          sed -i 's#\.target(name: "COnnxRuntime"#.binaryTarget(name: "sherpa_onnx", url: "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v1.13.8-ios-static.xcframework.zip", checksum: "0"),\n        .target(name: "COnnxRuntime"#' \
            "$tmp/Packages/AllyOnnx/Package.swift"
          bash scripts/lint/check_single_ort.sh "$tmp" || { echo "::error::страж ORT не пропустил binaryTarget sherpa"; exit 1; }
          echo "отрицательный контроль: пакеты со своим ORT — красный, binaryTarget sherpa — зелёный"

  delivery:
    runs-on: ubuntu-latest
    # §8.7: предохранитель, а не оптимизация — фазовый гейт читает файлы; 10 с запасом.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # breakers и метрики считаются по merge-base..HEAD
      # §8.3a: база диффа определяется ОДИН раз на джобу и называет отказ вслух.
      #
      # ⚠ Прежняя форма стояла в каждом шаге:
      # `BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}`.
      # На событии **push** `base_ref` пуст, фолбэк даёт `origin/main`, а на push
      # в main это САМ HEAD — дифф пуст. Четыре проверки судили пустоту: с
      # `okf@1.16` гейт канона краснел (и main краснел после КАЖДОГО слияния), а
      # breakers, ratchet и diff-coverage проходили ТРИВИАЛЬНО и молча, что хуже:
      # их зелёное уезжало в отчёт как «проверено». Замерено на `local-web-agent`
      # 2026-09-26, прогоны 36260966608 и 36260992795.
      #
      # Лестница без молчаливой ступени: PR — ветка назначения; push — состояние
      # ДО толчка (`github.event.before`); ни то ни другое недостижимо — отказ с
      # названной причиной, а не тихий фолбэк на HEAD.
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              # Новая ветка (before = нули) или переписанная история: прошлого
              # состояния в дереве нет. Берём общую базу с веткой по умолчанию —
              # и только если она НЕ равна HEAD, иначе это снова «судить ничего».
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Delivery phase gate + circuit breakers
        run: |
          if [ -f delivery/active/STATUS.md ]; then
            python scripts/delivery_check.py --require-ci --diff-base "$BASE"
          else
            # Между поставками проверка нужна ТЕМ БОЛЕЕ, а не «тем менее»: она
            # ловит просроченное наблюдение (§13.1) и отсутствие delivery/active/
            # в дереве (§2.3a) — оба состояния возникают именно тогда, когда
            # активной поставки нет. Шаблон CQG §8.3 печатал здесь skip, и
            # зелёное значило «никто не смотрел» (тренер: уроки L7, L15, L18;
            # кандидат наверх). Флаги — те же, что у активной ветки: с
            # delivery@2.04 гейт судит поставку, которую архивирует этот же дифф,
            # но только с базой («прогон без базы — не судятся»). Без --diff-base
            # сдача тем же коммитом проходила CI как «idle» (проба 2026-10-18:
            # неподписанный класс M в архиве — 0 ошибок без базы, 5 с ней).
            # Регрессия — delivery/evals/smoke/idle_overdue.sh.
            python scripts/delivery_check.py --require-ci --diff-base "$BASE"
          fi

      # Свой шаг проекта (adapted.json; поставка voice-core, решение ведущего 2026-10-19): дайджест утверждений
      # пересчитывается от базы PR и сверяется со строкой asserts_without_example в verify-report — устаревший или
      # поправленный руками дайджест больше не пропускает asserts_reviewed_by: n/a (Delivery §3.1d ур. 3; урок L26).
      - name: Assertion digest = verify-report
        if: always()
        run: python scripts/lint/check_digest_report.py

      # if: always() — как у джобы gates. Без него падение фазового гейта уносило
      # ЧЕТЫРЕ проверки ниже: они не запускались, и в логе их просто не было — тот же
      # механизм и то же число, что в разобранном случае 2026-07-28 (§6.0: «смотреть
      # ЛОГ прогона, а не факт наличия шага»). Нашло приёмочное развёртывание:
      # `gates 12/6`, `delivery 8/0`.
      - name: Canon sync gate (code <-> knowledge)
        if: always()
        run: |
          if [ -f scripts/okf_sync_gate.py ]; then
            python scripts/okf_sync_gate.py --base "$BASE"
          else
            echo "no OKF sync gate — skip"
          fi

      - name: Harness metrics (report only, never fails)
        if: always()
        run: |
          if [ -f scripts/delivery_metrics.py ]; then
            python scripts/delivery_metrics.py --base "$BASE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke evals (product oracles)
        if: always()
        run: |
          if [ -f delivery/evals/smoke/run.sh ]; then
            bash delivery/evals/smoke/run.sh
          else
            echo "no smoke suite — Delivery §6 backlog"
          fi

      - name: OKF bundle validator
        if: always()
        run: |
          if [ -f scripts/okf_validate.py ] && [ -d knowledge ]; then
            python scripts/okf_validate.py knowledge/
          else
            echo "no OKF bundle — skip"
          fi

      # Строка приёмки §6 «Payload самих канонов не сломан» помечена `auto`, а
      # `auto` по легенде §6 — «прибито скриптом», НЕ «есть команда, которую надо
      # не забыть набрать». До версии cqg@1.31 самопроверка вызывалась только из
      # чеклиста самой приёмки, то есть исполнителем был человек, читающий §6, —
      # и строка закрывалась заявлением (F7 восьмого развёртывания). §7.1 объявляет
      # вариант C дефолтом, но шага, который его исполняет, не было ни здесь, ни
      # в десяти шагах §5.
      # PyYAML ставится ЯВНО и до прогона: без парсера yaml-блоки проверяются
      # только на табы, самопроверка печатает «0 failures», и битый конфиг
      # проходит молча — реальный случай `stack-map@1.32` (`.pre-commit-config.yaml`
      # не парсился целиком, pre-commit не стартовал ни одним хуком).
      - name: Canon payload selftest (§7.1)
        if: always()
        run: |
          pip install PyYAML
          # Сверка записи со снимком. Сам selftest этого не ловит: он сверяет шапки
          # снимка с таблицей §1 ТОГО ЖЕ снимка, то есть сам с собой, — поэтому
          # «снимок отстал от upstream» изнутри проекта невидимо (lab-9 №3).
          # Здесь проверяется то, что изнутри видно: `stack:` в STATUS обязан
          # называть версии, которые в снимке реально лежат.
          if [ -d docs/canon ] && [ -f delivery/active/STATUS.md ]; then
            python - <<'CHECK'
          import re, pathlib, sys
          status = pathlib.Path("delivery/active/STATUS.md").read_text(encoding="utf-8")
          m = re.search(r"(?m)^\s*[-*]?\s*\**stack\**\s*:\s*(.+)$", status)
          if not m:
              print("нет строки stack: в STATUS — сверять не с чем"); sys.exit(0)
          claimed = dict(re.findall(r"([a-z]+)@([\d.]+)", m.group(1)))
          bad = []
          for layer, f in (("delivery", "AGENT_DELIVERY_HARNESS.md"),
                           ("cqg", "CODE_QUALITY_GATES.md"),
                           ("okf", "OKF_KNOWLEDGE_BUNDLE.md")):
              p = pathlib.Path("docs/canon") / f
              if layer not in claimed or not p.is_file():
                  continue
              h = re.search(r"\*\*Canon version:\*\*\s*`[a-z]+@([\d.]+)`",
                            p.read_text(encoding="utf-8"))
              if h and h.group(1) != claimed[layer]:
                  bad.append(f"{layer}: STATUS says {claimed[layer]}, snapshot has {h.group(1)}")
          if bad:
              print("::error::snapshot drifted from STATUS (AGENT_STACK §7.1):")
              for b in bad:
                  print("::error::" + b)
              sys.exit(1)
          print("stack: в STATUS совпадает со снимком docs/canon/")
          CHECK
          fi
          if [ -f docs/canon/stack_selftest.py ]; then
            python docs/canon/stack_selftest.py docs/canon     # вариант C (дефолт)
          elif [ -f stack_selftest.py ]; then
            python stack_selftest.py .                         # вариант A
          elif [ -d docs/canon ]; then
            echo "::error::docs/canon/ есть, а stack_selftest.py в снимке нет:"
            echo "::error::снимок неполон, проверять payload нечем (§7.1 вариант C, §5 шаг 11)"
            exit 1
          elif grep -qs 'stack-selftest:' delivery/STACK-ACCEPTANCE.md delivery/active/STATUS.md; then
            # Вариант B/D законен: каноны лежат вне репо, в CI их физически нет.
            # Но §7.1 требует ЗАПИСАТЬ это — иначе инвариант выглядит покрытым,
            # хотя не покрыт ничем. До cqg@1.31 правило держалось на честности
            # исполнителя.
            #
            # ⚠ Источников ДВА, и порядок несущий: `STACK-ACCEPTANCE.md` первым.
            # Объявление — свойство РЕПОЗИТОРИЯ, а `delivery/active/STATUS.md`
            # живёт одну поставку: на handoff он уезжает в архив (§2.3a), и
            # строка исчезает вместе с ним. Замер `ahrefs-cases` (уроки L7, L16)
            # — дважды: сначала строка не переехала между срезами и уронила CI,
            # потом поставка ушла в архив, и CI покраснел СНОВА, уже без всякой
            # ошибки исполнителя. Третий случай нашла соседняя сессия 01.10 в
            # `outreach-donors` ДО того, как он случился: первый же срез продаж
            # заменил бы STATUS и уронил бы прогон.
            echo "каноны вне репо — вариант B/D; объявление найдено, инвариант назван"
          else
            echo "::error::снимка канонов в репо нет, и строки stack-selftest: нет НИ В ОДНОМ"
            echo "::error::из двух мест: delivery/STACK-ACCEPTANCE.md (постоянное) или"
            echo "::error::delivery/active/STATUS.md (живёт одну поставку)."
            echo "::error::Разверни вариант C (§5 шаг 11) или объяви B/D:"
            echo "::error::stack-selftest: external (<путь>) — лучше в STACK-ACCEPTANCE."
            exit 1
          fi
