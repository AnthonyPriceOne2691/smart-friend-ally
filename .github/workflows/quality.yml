name: quality

# Адаптация шаблона CQG §8.3 под Smart Friend Ally (объявлена в
# scripts/lint/adapted.json). Продукт — Swift, кода пока нет; механика контура —
# python, идёт на ubuntu (macOS-раннер тарифицируется 10x, §8.7, а судить на нём
# пока нечего). Сняты: установка node/фронта, LINT_*-пути под backend/frontend,
# шаги diff-coverage, deps-audit и mutation — их роли объявлены в
# scripts/lint/not-applicable.json с причиной. Инструменты — из корневого
# requirements-dev.txt в .venv. Остальное — дословно.

on:
  pull_request:
  push:
    branches: [main]

# Отмена устаревших прогонов той же ветки. Без этого пуш серии коммитов держит
# столько параллельных прогонов, сколько было пушей, и квота уходит на проверку
# кода, который уже неактуален. §8.7 требует считать цену прогона — это первый
# способ её снизить, не убирая ни одной проверки.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  STRICT: "1"                 # soft-режим в CI запрещён (Delivery §10.4)

jobs:
  gates:
    runs-on: ubuntu-latest
    # §8.7: предохранитель, а не оптимизация — гейты — секунды-минуты; 20 значит «что-то повисло».
    timeout-minutes: 20
    # Маски Swift для канонных гейтов (CQG §5.5: адаптация в конфиге). Те же значения стоят в entry хуков;
    # здесь — чтобы доктор, который зовёт гейт напрямую, судил тот же код, что и pre-commit.
    env:
      LINT_LENGTH_GLOBS: "*.swift *.py"
      LINT_PY_SRC: Packages/AllyDiscipline/Sources
      LINT_JSCPD_PY_FORMAT: swift
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # нужен для BASE-диффа: baseline-ratchet и new-dependency
      # §8.3a: база диффа определяется ОДИН раз на джобу и называет отказ вслух.
      # Лестница без молчаливой ступени: PR — ветка назначения; push — состояние
      # ДО толчка (`github.event.before`); ни то ни другое недостижимо — отказ с
      # названной причиной, а не тихий фолбэк на HEAD.
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              # Новая ветка (before = нули) или переписанная история: прошлого
              # состояния в дереве нет. Берём общую базу с веткой по умолчанию —
              # и только если она НЕ равна HEAD, иначе это снова «судить ничего».
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      # ⚠ Версия ОБЯЗАНА совпадать с локальной: .venv проекта — 3.12.
      # ⚠ `cache-dependency-path` задан ЯВНО — находка первого прогона Ally
      # (36990914981): охрана `cache:` в шаблоне смотрит `**/requirements*.txt`,
      # а setup-python по умолчанию ищет точное `**/requirements.txt`. На проекте
      # только с requirements-dev.txt охрана включала кэш, а действие не находило
      # файла и роняло всю джобу гейтов до первого гейта.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') != '' && 'pip' || '' }}
          cache-dependency-path: requirements-dev.txt

      # Инструменты контура — по манифесту, а не командой мимо него (lab-11 F9):
      # тот же requirements-dev.txt, что ставится локально в .venv.
      - name: Install contour tools
        run: |
          python -m venv .venv
          echo "deps: requirements-dev.txt"
          .venv/bin/pip install -r requirements-dev.txt
          # Swift-контур (поставка swift-contour): SwiftLint — Linux-сборка релиза, jscpd — npm; версии закреплены.
          if git ls-files -- '*.swift' | grep -q .; then
            curl -fsSL -o /tmp/swiftlint.zip \
              https://github.com/realm/SwiftLint/releases/download/0.65.0/swiftlint_linux_amd64.zip
            sudo unzip -o -q /tmp/swiftlint.zip swiftlint -d /usr/local/bin
            sudo chmod +x /usr/local/bin/swiftlint
            # SourceKit для SwiftLint на Linux — из Swift, что стоит на образе раннера
            if command -v swift >/dev/null; then
              echo "LINUX_SOURCEKIT_LIB_PATH=$(dirname "$(dirname "$(readlink -f "$(command -v swift)")")")/lib" >> "$GITHUB_ENV"
            fi
            swiftlint version
            npm install -g jscpd@4.0.5 >/dev/null 2>&1
            jscpd --version
          fi

      # ⚠ ГЛАВНЫЙ УРОК восьмого развёртывания: упавшая установка превращает
      # честные пропуски гейтов в «гейты прошли». Здесь пропуск переводится в
      # КРАСНОЕ до гейтов. Список выводится из того, что объявил САМ ПРОЕКТ:
      # инструмент ожидается, если есть манифест его половины и роль не объявлена
      # неприменимой в scripts/lint/not-applicable.json.
      - name: Инструменты гейтов на месте (иначе пропуск читается как успех)
        run: |
          na="scripts/lint/not-applicable.json"
          skip() { [ -f "$na" ] && grep -q "\"$1\"" "$na"; }
          have() {
            for p in "backend/.venv/bin/$1" ".venv/bin/$1" "node_modules/.bin/$1" \
                     "${LINT_FE_DIR:-frontend}/node_modules/.bin/$1"; do
              [ -x "$p" ] && return 0
            done
            command -v "$1" >/dev/null 2>&1
          }
          missing=""; checked=""
          expect() { skip "$1" || { checked="$checked $1"; have "$1" || missing="$missing $1"; }; }
          expect detect-secrets
          if ls pyproject.toml */pyproject.toml requirements*.txt */requirements*.txt 2>/dev/null | grep -q .; then
            expect ruff; expect mypy
          fi
          if [ -f package.json ] || [ -f "${LINT_FE_DIR:-frontend}/package.json" ]; then
            expect eslint; expect jscpd
          fi
          if git ls-files -- '*.swift' | grep -q .; then
            expect swiftlint; expect jscpd
          fi
          if [ -n "$missing" ]; then
            echo "::error::инструменты гейтов не поставились:$missing"
            echo "Гейты ниже уйдут в честный пропуск, и джоба будет ВЫГЛЯДЕТЬ проверенной."
            echo "Смотри шаг установки: он упал или поставил не туда (§8.3)."
            echo "Инструмент не нужен на этом стеке — объяви роль в $na (§5.5)."
            exit 1
          fi
          echo "toolchain: проверено ->$checked (пусто = все роли объявлены n/a)"

      # ⚠ `if: always()` на КАЖДОМ независимом гейте: шаг, который крашится,
      # обрывает джобу, и подключённый гейт за ним неотличим от отсутствующего.
      # ⚠ `--verbose` обязателен: без него pre-commit глотает stdout прошедших
      # хуков, и числа «просмотрено N файл(ов)» в лог CI не попадают.
      - name: pre-commit (all files, STRICT=1)
        id: precommit
        run: |
          .venv/bin/pre-commit run --all-files --show-diff-on-failure --verbose

      - name: Gate coverage (все гейты подключены)
        if: always()
        run: bash scripts/lint/check_gate_coverage.sh

      # Третий из трёх разных вопросов §5 шаг 5: вписаны · зелены · СУДЯТ ли.
      # `DEAD` роняет шаг, `WEAK`/`ABSENT`/`SKIP` — нет.
      - name: Contour doctor (гейты не только вписаны, но и судят)
        if: always()
        run: python3 scripts/lint/contour_doctor.py

      - name: Baseline ratchet (снимки только вниз)
        if: always()
        run: bash scripts/lint/check_baseline_ratchet.sh

      # Новая прямая зависимость обязана быть объявлена решением в STATUS.
      # Здесь, а не на коммите: нужен remote-ref для сравнения манифестов.
      - name: New dependency declared
        if: always()
        run: python scripts/lint/check_new_dependency.py

      # Diff coverage, Vulnerable dependencies, Mutation testing канона — сняты: pip-audit/mutmut/pytest-cov к Swift
      # не относятся. Покрытие Swift — джоба swift ниже (check_swift_coverage.sh); роль мутаций правил исполнителя —
      # тесты абляции пакета; зависимостей у пакета нет. Объявления — scripts/lint/not-applicable.json.

  swift:
    runs-on: ubuntu-latest
    # Swift-пакеты: тесты и покрытие строк ≥ 70% (check_swift_coverage.sh). Swift — с образа раннера, версия в логе
    # (macOS-раннер ×10, §8.7: пакет — только Foundation и собирается на Linux). 15 мин — сборка с нуля и два прогона.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Swift toolchain
        run: swift --version
      - name: Swift tests and coverage (check_swift_coverage.sh, порог 70%)
        run: bash scripts/lint/check_swift_coverage.sh
      # Отрицательный контроль: гейт, который проходит с порогом 101%, слеп (CQG §6 — гейт обязан уметь краснеть).
      - name: Coverage gate is not blind (порог 101% обязан покраснеть)
        run: |
          if LINT_COVERAGE_MIN=101 bash scripts/lint/check_swift_coverage.sh; then
            echo "::error::гейт покрытия прошёл с порогом 101% — он слеп"
            exit 1
          fi
          echo "отрицательный контроль: гейт покраснел, как и должен"

  delivery:
    runs-on: ubuntu-latest
    # §8.7: предохранитель, а не оптимизация — фазовый гейт читает файлы; 10 с запасом.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0      # breakers и метрики считаются по merge-base..HEAD
      - name: Diff base (одна на джобу, отказ — вслух)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            zero="0000000000000000000000000000000000000000"
            if [ -n "$before" ] && [ "$before" != "$zero" ] \
               && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base="$before"
            else
              default="${{ github.event.repository.default_branch }}"
              base="$(git merge-base "origin/$default" HEAD 2>/dev/null || true)"
              if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
                echo "::error::база диффа не определима (before=$before, default=$default):"\
                     "первый push репозитория или переписанная история." \
                     "Открой PR или сделай второй коммит — гейт не имеет права судить пустоту."
                exit 1
              fi
            fi
          fi
          echo "BASE=$base" >> "$GITHUB_ENV"
          echo "база диффа: $base"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Delivery phase gate + circuit breakers
        run: |
          if [ -f delivery/active/STATUS.md ]; then
            python scripts/delivery_check.py --require-ci --diff-base "$BASE"
          else
            # Между поставками проверка нужна ТЕМ БОЛЕЕ, а не «тем менее»: она
            # ловит просроченное наблюдение (§13.1) и отсутствие delivery/active/
            # в дереве (§2.3a) — оба состояния возникают именно тогда, когда
            # активной поставки нет. Шаблон CQG §8.3 печатал здесь skip, и
            # зелёное значило «никто не смотрел» (тренер: уроки L7, L15, L18).
            # Без --require-ci и --diff-base: без активной поставки у них нет
            # предмета. Регрессия — delivery/evals/smoke/idle_overdue.sh.
            python scripts/delivery_check.py
          fi

      # Swift-половина ревью утверждений (Delivery §3.1d, уровень 3): канонный assert_digest.sh Swift-тестов не видит
      # (delivery/incidents/2026-10-18-assert-digest-swift.md), и `asserts_reviewed_by: n/a` проходил бы на пустоте.
      - name: Assertion digest — Swift (n/a над утверждениями без примера = красный)
        if: always()
        run: python scripts/lint/assert_digest_swift.py --check

      # if: always() — как у джобы gates: падение фазового гейта не уносит проверки ниже.
      - name: Canon sync gate (code <-> knowledge)
        if: always()
        run: |
          if [ -f scripts/okf_sync_gate.py ]; then
            python scripts/okf_sync_gate.py --base "$BASE"
          else
            echo "no OKF sync gate — skip"
          fi

      - name: Harness metrics (report only, never fails)
        if: always()
        run: |
          if [ -f scripts/delivery_metrics.py ]; then
            python scripts/delivery_metrics.py --base "$BASE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Smoke evals (product oracles)
        if: always()
        run: |
          if [ -f delivery/evals/smoke/run.sh ]; then
            bash delivery/evals/smoke/run.sh
          else
            echo "no smoke suite — Delivery §6 backlog"
          fi

      - name: OKF bundle validator
        if: always()
        run: |
          if [ -f scripts/okf_validate.py ] && [ -d knowledge ]; then
            python scripts/okf_validate.py knowledge/
          else
            echo "no OKF bundle — skip"
          fi

      # Строка приёмки §6 «Payload самих канонов не сломан» — `auto` только с
      # постоянным исполнителем, и он здесь. PyYAML ставится ЯВНО: без парсера
      # yaml-блоки проверяются урезанно, и битый конфиг проходит молча.
      - name: Canon payload selftest (§7.1)
        if: always()
        run: |
          pip install PyYAML
          # Сверка записи со снимком: `stack:` в STATUS обязан называть версии,
          # которые в снимке реально лежат (lab-9 №3).
          if [ -d docs/canon ] && [ -f delivery/active/STATUS.md ]; then
            python - <<'CHECK'
          import re, pathlib, sys
          status = pathlib.Path("delivery/active/STATUS.md").read_text(encoding="utf-8")
          m = re.search(r"(?m)^\s*[-*]?\s*\**stack\**\s*:\s*(.+)$", status)
          if not m:
              print("нет строки stack: в STATUS — сверять не с чем"); sys.exit(0)
          claimed = dict(re.findall(r"([a-z]+)@([\d.]+)", m.group(1)))
          bad = []
          for layer, f in (("delivery", "AGENT_DELIVERY_HARNESS.md"),
                           ("cqg", "CODE_QUALITY_GATES.md"),
                           ("okf", "OKF_KNOWLEDGE_BUNDLE.md")):
              p = pathlib.Path("docs/canon") / f
              if layer not in claimed or not p.is_file():
                  continue
              h = re.search(r"\*\*Canon version:\*\*\s*`[a-z]+@([\d.]+)`",
                            p.read_text(encoding="utf-8"))
              if h and h.group(1) != claimed[layer]:
                  bad.append(f"{layer}: STATUS says {claimed[layer]}, snapshot has {h.group(1)}")
          if bad:
              print("::error::snapshot drifted from STATUS (AGENT_STACK §7.1):")
              for b in bad:
                  print("::error::" + b)
              sys.exit(1)
          print("stack: в STATUS совпадает со снимком docs/canon/")
          CHECK
          fi
          if [ -f docs/canon/stack_selftest.py ]; then
            python docs/canon/stack_selftest.py docs/canon     # вариант C (дефолт)
          elif [ -f stack_selftest.py ]; then
            python stack_selftest.py .                         # вариант A
          elif [ -d docs/canon ]; then
            echo "::error::docs/canon/ есть, а stack_selftest.py в снимке нет:"
            echo "::error::снимок неполон, проверять payload нечем (§7.1 вариант C, §5 шаг 11)"
            exit 1
          elif grep -qs 'stack-selftest:' delivery/STACK-ACCEPTANCE.md delivery/active/STATUS.md; then
            echo "каноны вне репо — вариант B/D; объявление найдено, инвариант назван"
          else
            echo "::error::снимка канонов в репо нет, и строки stack-selftest: нет НИ В ОДНОМ"
            echo "::error::из двух мест: delivery/STACK-ACCEPTANCE.md (постоянное) или"
            echo "::error::delivery/active/STATUS.md (живёт одну поставку)."
            echo "::error::Разверни вариант C (§5 шаг 11) или объяви B/D:"
            echo "::error::stack-selftest: external (<путь>) — лучше в STACK-ACCEPTANCE."
            exit 1
          fi
