# Ручная macOS-джоба приложения (поставка app-voice-loop, решение E3): раз на поставку, а не на каждый PR — минута
# macOS стоит десяти Linux (CQG §8.7), а ядро и форму кода уже судит Linux-джоба quality. Что делает: тесты AllyLlama
# (A23 без весов — пропуск виден, П34), AllyOnnx и AllyVoice (серия голоса: Z2–Z7 без весов — пропуск),
# тесты AllyShell со снимками (V8), сборка Ally.app без подписи, оракул артефакта (A7).
# Подписанную сборку, права (A8) и телефон (A9–A12) судит человек с Mac: команды — knowledge/engineering/voice-loop.md.
name: ios

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  app:
    # Метка `macos` на PR — тот же ручной запуск до мержа: `workflow_dispatch` видит только файлы ветки по умолчанию.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'macos'
    # app-glass: цель iOS 27.0 требует SDK iOS 27 — он есть на образе xcode-27 (preview: macOS 27.0.1, Xcode 27.1 по
    # умолчанию, как на Mac разработки), а на macos-26 только Xcode 26.x; решение ведущего 2026-10-27.
    runs-on: xcode-27
    # §8.7: предохранитель — сборка пакетов с нуля и приложения ≈ 10 мин; 30 значит «что-то повисло».
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (версии в лог)
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      - name: AllyLlama tests (A23; без весов — пропуск)
        run: swift test --disable-keychain --package-path Packages/AllyLlama
      - name: AllyOnnx tests (один ORT 1.28.0, слой C API)
        run: swift test --disable-keychain --package-path Packages/AllyOnnx
      # Слух (D7.2): пара sherpa 1.13.8 / ORT 1.28.0 на настоящем рантайме (U16); паритет флагов Silero (U17) — только с
      # моделью и набором спайка в local/, на раннере — видимый пропуск (П34).
      - name: AllyHearing tests (U16, U17)
        run: swift test --disable-keychain --package-path Packages/AllyHearing
      - name: AllyVoice tests (Z2–Z7; без весов и эталонов в ~/models — пропуск)
        run: swift test --disable-keychain --package-path Packages/AllyVoice
      - name: AllyCore tests on macOS (G7 — подпись родителя на CryptoKit; на Linux пропуск)
        run: swift test --disable-keychain --package-path Packages/AllyCore --filter SignatureTests
      # Оболочка (child-shell): рисунок SwiftUI и пиксельные пробы снимков (V8) — только на macOS; ядро судит Linux.
      - name: AllyShell tests (V1–V9, снимки V8)
        run: swift test --disable-keychain --package-path Packages/AllyShell
      - name: Ally.app для устройства без подписи
        run: |
          cd App && xcodegen generate
          xcodebuild -project Ally.xcodeproj -scheme Ally -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Оракул артефакта (check_app_artifact.sh)
        run: bash scripts/lint/check_app_artifact.sh
      # design-demo: демо облика под симулятор без подписи (Y1) — свой каталог, оракул артефакта приложения его не видит;
      # граница демо (Y1–Y3, Y5) судит проект, Ally.app и AllyDemo.app.
      - name: AllyDemo для симулятора без подписи (Y1)
        run: |
          cd App && xcodebuild -project Ally.xcodeproj -scheme AllyDemo -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-demo CODE_SIGNING_ALLOWED=NO build
      - name: Граница демо (check_demo_boundary.sh)
        run: bash scripts/lint/check_demo_boundary.sh
